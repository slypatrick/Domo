name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.f.outputs.app }}
      site: ${{ steps.f.outputs.site }}
      migrations: ${{ steps.f.outputs.migrations }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - id: f
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || ! git rev-parse HEAD~1 >/dev/null 2>&1; then
            echo "app=true" >> $GITHUB_OUTPUT; echo "site=true" >> $GITHUB_OUTPUT; echo "migrations=true" >> $GITHUB_OUTPUT; exit 0; fi
          CH=$(git diff --name-only HEAD~1 HEAD)
          echo "$CH"
          echo "app=$(echo "$CH" | grep -q '^app/' && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "site=$(echo "$CH" | grep -q '^site/' && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "migrations=$(echo "$CH" | grep -q '^app/migrations/' && echo true || echo false)" >> $GITHUB_OUTPUT

  app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Check syntax
        working-directory: app
        run: |
          node --check src/worker.js
          node -e "const s=require('fs').readFileSync('public/index.html','utf8');const m=[...s.matchAll(/<script(?![^>]*(src|type=\"application\/ld))[^>]*>([\s\S]*?)<\/script>/g)];let bad=0;m.forEach(x=>{try{new Function(x[2])}catch(e){bad=1;console.error(e.message)}});process.exit(bad)"
      - name: Apply database migrations
        if: needs.changes.outputs.migrations == 'true'
        working-directory: app/pages
        run: npx --yes wrangler@4 d1 migrations apply wsel --remote
      - name: Build
        working-directory: app
        run: rm -rf dist && cp -r public dist && cp src/worker.js dist/_worker.js
      - name: Deploy app.domo.tn
        working-directory: app/pages
        run: npx --yes wrangler@4 pages deploy ../dist --project-name patricksly --branch main --commit-dirty=true

  site:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Deploy domo.tn
        run: npx --yes wrangler@4 pages deploy site --project-name domo-tn --branch main --commit-dirty=true
