<!doctype html><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500&display=swap" rel="stylesheet">
<style>body{margin:0;padding:30px;background:#e9e5dc;width:1500px;font-family:system-ui,sans-serif;color:#0e1630}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#efebe3;border-radius:18px;height:400px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;position:relative;box-shadow:inset 0 0 0 1px rgba(0,0,0,.04)}
.card img{width:74%}.tag{font:500 17px Barlow,sans-serif;letter-spacing:.32em;color:#1d3fd1}.n{position:absolute;top:16px;left:20px;font:700 15px system-ui;color:#9aa0b4}
.row2{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:16px}.l{background:#fff;border-radius:18px;height:170px;display:flex;align-items:center;justify-content:center}.l img{width:82%}
.b{background:#1d3fd1;border-radius:18px;height:150px;display:flex;align-items:center;justify-content:center}.b img{width:60%}</style>
<div class="g">
<div class="card"><span class="n">1</span><img src="domo-bleu-1-blue.svg"><div class="tag">TOUT AU MÊME ENDROIT</div></div>
<div class="card"><span class="n">2</span><img src="domo-bleu-2-blue.svg"><div class="tag">TOUT AU MÊME ENDROIT</div></div>
<div class="card"><span class="n">3</span><img src="domo-bleu-3-blue.svg"><div class="tag">TOUT AU MÊME ENDROIT</div></div></div>
<div class="row2"><div class="l"><img src="lockup-1.svg"></div><div class="l"><img src="lockup-2.svg"></div><div class="l"><img src="lockup-3.svg"></div></div>
<div class="row2"><div class="b"><img src="domo-bleu-1-white.svg"></div><div class="b"><img src="domo-bleu-2-white.svg"></div><div class="b"><img src="domo-bleu-3-white.svg"></div></div>
