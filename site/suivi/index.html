<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suivre un colis — Domo</title>
<meta name="description" content="Entrez votre numéro de commande Domo pour suivre votre colis.">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://domo.tn/suivi/">
<meta property="og:title" content="Suivre un colis — Domo"><meta property="og:description" content="Entrez votre numéro de commande Domo pour suivre votre colis."><meta property="og:type" content="website"><meta property="og:url" content="https://domo.tn/suivi/"><meta property="og:image" content="https://domo.tn/img/hero-seller.webp?v=3">
<meta name="theme-color" content="#0133F8"><link rel="icon" href="/icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--blue:#0133F8;--navy:#0e1630;--ink:#26304d;--muted:#5b6582;--paper:#f5f7fc;--line:#dde2f0;--coral:#ff5a3c;--display:'Bricolage Grotesque',system-ui,sans-serif;--body:'Instrument Sans',system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;font:400 17px/1.65 var(--body);color:var(--ink);background:#fff}
a{color:var(--blue)}:focus-visible{outline:3px solid var(--coral);outline-offset:3px;border-radius:6px}
header{border-bottom:1px solid var(--line)}header .in,main,footer .in{max-width:760px;margin:0 auto;padding:0 22px}
header .in{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{display:flex;align-items:center;gap:10px;font:800 21px var(--display);color:var(--navy);text-decoration:none}.logo img{width:28px;height:28px}
header nav a{font-weight:600;text-decoration:none;color:var(--ink)}
main{padding-top:44px;padding-bottom:64px}
h1{font:800 clamp(32px,6vw,46px)/1.05 var(--display);color:var(--navy);letter-spacing:-.03em;margin:0 0 8px;text-wrap:balance}
h2{font:700 23px/1.2 var(--display);color:var(--navy);margin:38px 0 8px;letter-spacing:-.01em}
.upd{color:var(--muted);margin:0 0 28px}p,li{max-width:68ch}ul{padding-left:22px}li{margin:4px 0}
.note{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin:22px 0}
footer{border-top:1px solid var(--line);background:var(--paper);padding:26px 0;font-size:15px;color:var(--muted)}
footer nav{display:flex;flex-wrap:wrap;gap:6px 20px;margin-bottom:8px}footer a{color:var(--ink)}
</style></head><body>
<header><div class="in"><a class="logo" href="/"><img src="/icon.svg" alt="" width="28" height="28">Domo</a><nav><a href="/">Retour au site</a></nav></div></header>
<main><h1>Suivre un colis</h1>
<p>Entrez le numéro reçu sur WhatsApp, par exemple <span style="white-space:nowrap">DM-B27RPM</span>.</p>
<form id="f" style="display:flex;gap:10px;flex-wrap:wrap;margin-top:18px" novalidate>
<label class="vh" for="ref" style="position:absolute;left:-9999px">Numéro de commande</label>
<input id="ref" autocomplete="off" autocapitalize="characters" placeholder="DM-XXXXXX" style="flex:1;min-width:200px;font:600 18px var(--body);padding:14px 16px;border:1.5px solid var(--line);border-radius:12px">
<button style="font:700 17px var(--body);padding:14px 22px;border:0;border-radius:12px;background:var(--blue);color:#fff;cursor:pointer">Suivre mon colis</button></form>
<p id="e" role="alert" style="color:#b42318;margin-top:10px"></p>
<script>
document.getElementById('f').addEventListener('submit',function(ev){ev.preventDefault();
var v=document.getElementById('ref').value.toUpperCase().replace(/[^A-Z0-9]/g,'');
if(!/^(DM|WS)[A-Z0-9]{6}$/.test(v)){document.getElementById('e').textContent='Numéro invalide. Format attendu : DM-XXXXXX';return}
location.href='https://app.domo.tn/?track='+v.slice(0,2)+'-'+v.slice(2)});
</script>
</main>
<footer><div class="in"><nav aria-label="Pied de page"><a href="/">Accueil</a><a href="/confidentialite/">Confidentialité</a><a href="/conditions/">Conditions</a><a href="/mentions-legales/">Mentions légales</a><a href="mailto:support@domo.tn">support@domo.tn</a></nav><span>© 2026 Domo, Tunisie</span></div></footer></body></html>
